# azure-blade skin bundle patch: inserts its dsh.client row into the web plugin roster.
# Mutual exclusion between skins is managed by the skin-center's dsh-skin use
# (home-layer managed rows), so this bundle only contributes the entry id.
- insert:
    - id: ui-skin-azure-blade
      name: '@dsh-external/dsh-client-ui-skin-azure-blade'
