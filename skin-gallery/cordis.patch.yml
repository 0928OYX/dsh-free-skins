# skin-gallery bundle patch: inserts its dsh.client entry into the web plugin roster.
# The bundle is the official dsh plugin shape — install it with
# `dsh plugin --profile <name> add <path>`; it registers the 界面皮肤 settings section.
# Note: the profile wiring used by scripts/deploy.mjs is a cordis.patch.yml insert
# row (hot-reloadable on CLI surfaces), so this bundle patch is the alternative
# channel for profiles that install the package through dsh.profile.bundles.
- insert:
    - id: ui-app-skin-gallery
      name: '@dsh-external/dsh-client-ui-skin-gallery'
